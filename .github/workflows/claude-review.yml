name: Claude Code Review

# Thin caller — delegates to the WEBREKA-shared reusable review workflow in
# ssozaks/webreka-system (a single review definition for every WEBREKA repo).
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (Claude Max subscription, zero
# per-call cost). Set it once per repo: `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
#
# Runner: defaults to GitHub-hosted (free within the monthly Actions quota).
# Once this repo has an ONLINE WEBREKA self-hosted runner, switch to keep it
# off the metered minutes entirely:
#     runner: '["self-hosted","webreka"]'

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    uses: ssozaks/webreka-system/.github/workflows/_claude-review-reusable.yml@main
    secrets: inherit
    with:
      runner: '["ubuntu-latest"]'
      max_turns: 20
