name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip broken local symlinks
        # Same step as ssozaks/webreka-system _claude-review-reusable.yml: the
        # tracked .claude/ links point to /home/aiserverwebreka/webreka-system/...,
        # which does not exist on a GitHub runner. When a PR touches .claude/,
        # the action restores it from the base branch and leaves placeholders
        # for those links (hooks included); the run then ends in ~2 s with
        # result is_error:true. Delete the broken links before the action runs.
        run: |
          if [ -d .claude ]; then
            find .claude -type l ! -exec test -e {} \; -print -delete || true
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR for:
            1. Logic errors and bugs
            2. Security vulnerabilities (OWASP Top 10)
            3. Turkish character handling (toLocaleUpperCase/toLowerCase with 'tr')
            4. Performance (N+1 queries, unnecessary re-renders, bundle size)
            5. Missing error handling
            Rate severity: CRITICAL, HIGH, MEDIUM, LOW.
          claude_args: "--model claude-sonnet-5-5 --max-turns 5"
